# Apple Developer Program に登録してから使う。README の「TestFlight へ送る」を参照。
# ponytail: まだ一度も動かしていない。登録後の初回で直す前提。
name: testflight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Download dictionary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dictionary -p dictionary.tar.gz
          mkdir -p Resources && tar -xzf dictionary.tar.gz -C Resources && rm dictionary.tar.gz
      - name: Download Zenzai weight
        run: |
          # zenz-v3.2-xsmall（CC BY-SA 4.0）。コミットとハッシュ値を固定する
          curl -fsSL -o Resources/zenz.gguf             https://huggingface.co/Miwa-Keita/zenz-v3.2-xsmall-gguf/resolve/42cab8392a3727d1cf80932cf2275b7d523fbb9f/ggml-model-Q5_K_M.gguf
          echo "00c64b3d318045a708d0cad5434faccab10f5481a49e6362864551fd0995fa58  Resources/zenz.gguf" | shasum -a 256 -c
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project FlickKey.xcodeproj -scheme FlickKey -destination 'generic/platform=iOS' \
            -archivePath build/FlickKey.xcarchive "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" | xcbeautify
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/FlickKey.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" | xcbeautify
