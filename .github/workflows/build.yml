name: build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - name: Test on simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          set -o pipefail
          xcodebuild test -project FlickKey.xcodeproj -scheme FlickKey -destination "id=$UDID" \
            -clonedSourcePackagesDirPath SourcePackages -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project FlickKey.xcodeproj -scheme FlickKey -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Check dictionary is inside the keyboard extension
        run: |
          APP=build/dd/Build/Products/Debug-iphoneos/FlickKey.app
          ls "$APP/PlugIns/FlickKeyboard.appex/"
          du -sh "$APP" "$APP/PlugIns/FlickKeyboard.appex/"*.bundle
          ls -d "$APP/PlugIns/FlickKeyboard.appex/"*DefaultDictionary*.bundle
