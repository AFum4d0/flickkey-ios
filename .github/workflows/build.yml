name: build

on:
  push:
    paths-ignore: ["dict/**", "eval/**", ".github/workflows/dictionary.yml", ".github/workflows/lm.yml", ".github/workflows/eval.yml", "README.md"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Download dictionary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dictionary -p dictionary.tar.gz
          mkdir -p Resources && tar -xzf dictionary.tar.gz -C Resources && rm dictionary.tar.gz
          du -sh Resources/*
      - name: Download Zenzai weight
        run: |
          # zenz-v3.2-xsmall（CC BY-SA 4.0）。コミットとハッシュ値を固定する
          curl -fsSL -o Resources/zenz.gguf             https://huggingface.co/Miwa-Keita/zenz-v3.2-xsmall-gguf/resolve/42cab8392a3727d1cf80932cf2275b7d523fbb9f/ggml-model-Q5_K_M.gguf
          echo "00c64b3d318045a708d0cad5434faccab10f5481a49e6362864551fd0995fa58  Resources/zenz.gguf" | shasum -a 256 -c
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - name: Test on simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          set -o pipefail
          xcodebuild test -project FlickKey.xcodeproj -scheme FlickKey -destination "id=$UDID" \
            -clonedSourcePackagesDirPath SourcePackages -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project FlickKey.xcodeproj -scheme FlickKey -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Check dictionary is inside the keyboard extension
        run: |
          APP=build/dd/Build/Products/Debug-iphoneos/FlickKey.app
          ls "$APP/PlugIns/FlickKeyboard.appex/"
          du -sh "$APP" "$APP/PlugIns/FlickKeyboard.appex"
          test -d "$APP/PlugIns/FlickKeyboard.appex/Dictionary/louds"
          test -f "$APP/PlugIns/FlickKeyboard.appex/EmojiDictionary/emoji_all_E16.0.txt"
          test -f "$APP/PlugIns/FlickKeyboard.appex/zenz.gguf"
