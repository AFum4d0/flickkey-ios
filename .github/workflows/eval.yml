# AJIMEE-Bench（200 問、CC BY-SA 3.0）で変換の正解率を測る。手動で動かす。
name: eval

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZK_VERSION: v0.11.2
  AJIMEE_SHA: 401666cd56d1a570c2021798b64b6da4396bfd45

jobs:
  eval:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build CLI with Zenzai
        run: |
          set -o pipefail
          git clone -q --depth 1 --branch "$AZK_VERSION" --recurse-submodules --shallow-submodules \
            https://github.com/azooKey/AzooKeyKanaKanjiConverter azk
          # evaluate は Zenzai に v2 の形式で文脈を渡すが、使うモデル（zenz-v3.2）は v3 なので合わせる
          cd azk && sed -i '' 's/versionDependentMode: .v2(.init(leftSideContext:/versionDependentMode: .v3(.init(leftSideContext:/'             Sources/CliTool/Subcommands/EvaluateCommand.swift && grep -c ".v3(.init(leftSideContext:" Sources/CliTool/Subcommands/EvaluateCommand.swift
          # evaluate は「読み全体に一致する候補だけ」（.完全一致）で変換させる。そのとき変換器は候補を辞書の点数順に
          # 並べ直し、Zenzai が選んだ順番を捨ててしまう。アプリ（通常の変換）では Zenzai の順番が残るので、それに合わせる
          KKC=$(find Sources -name KanaKanjiConverter.swift -path "*KanaKanjiConverterModule/*" | head -1)
          perl -0pi -e 's/let merged = self\.getUniqueCandidate\(wholeSentenceUniqueCandidates\.chained\(userShortcutsCandidates\)\)\.sorted\(by: \{\$0\.value > \$1\.value\}\)/let merged = options.zenzaiMode.enabled ? self.getUniqueCandidate(wholeSentenceUniqueCandidates.chained(userShortcutsCandidates)) : self.getUniqueCandidate(wholeSentenceUniqueCandidates.chained(userShortcutsCandidates)).sorted(by: {\$0.value > \$1.value})/' "$KKC"
          grep -q "options.zenzaiMode.enabled ? self.getUniqueCandidate" "$KKC"
          swift build -c release --traits Zenzai 2>&1 | tail -3
      - name: Get benchmark and models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o ajimee.json "https://raw.githubusercontent.com/azooKey/AJIMEE-Bench/$AJIMEE_SHA/JWTD_v2/v1/evaluation_items.json"
          python3 eval/ajimee_to_input.py ajimee.json input.json
          curl -fsSL -o xsmall.gguf https://huggingface.co/Miwa-Keita/zenz-v3.2-xsmall-gguf/resolve/42cab8392a3727d1cf80932cf2275b7d523fbb9f/ggml-model-Q5_K_M.gguf
          echo "00c64b3d318045a708d0cad5434faccab10f5481a49e6362864551fd0995fa58  xsmall.gguf" | shasum -a 256 -c
          curl -fsSL -o small.gguf https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/ef3e66e3665fe6a19598e6578e9b88a994b647fd/ggml-model-Q5_K_M.gguf
          echo "29c223d4c23327b80fd13ebb5ab2555057a46317997d5da391584ffbef0db673  small.gguf" | shasum -a 256 -c
          gh release download dictionary -p dictionary.tar.gz && mkdir ours && tar -xzf dictionary.tar.gz -C ours
          # 比べるための別の版（どちらも CC BY-SA 4.0）
          curl -fsSL -o small31.gguf https://huggingface.co/Miwa-Keita/zenz-v3.1-small-gguf/resolve/ddf6e44b2e05ab7ea9a3e31559c5e7948761365c/ggml-model-Q5_K_M.gguf
          echo "4de930c06bef8c263aa1aa40684af206db4ce1b96375b3b8ed0ea508e0b14f6c  small31.gguf" | shasum -a 256 -c
          # アプリと同じく、前の文を後ろの 20 文字だけにした入力
          python3 -c "import json; d=json.load(open('input.json')); [x.update(left_context=x['left_context'][-20:]) for x in d if x['left_context']]; json.dump(d, open('input20.json','w'), ensure_ascii=False)"
      - name: Evaluate
        run: |
          CLI=azk/.build/release/CliTool
          DICT=azk/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_dictionary_storage/Dictionary
          echo "| 設定 | 1 位正解 | 3 位以内 | 1 位（文脈あり） | 1 位（文脈なし） |" > scores.md
          echo "|---|---|---|---|---|" >> scores.md
          # 作り直した辞書に差し替えて作り直す（evaluate は組み込みの辞書を使う）
          rm -rf "$DICT/louds" && cp -r ours/Dictionary/louds "$DICT/louds"
          (cd azk && swift build -c release --traits Zenzai 2>&1 | tail -1)
          run() {  # run <名前> <出力> <入力> [evaluate の引数...]
            local name=$1 out=$2 in=$3; shift 3
            local t0=$SECONDS
            # 1 つの設定が落ちても、残りの設定は続ける
            $CLI evaluate "$in" --output "$out" "$@" > /dev/null \
              && python3 eval/score.py "$name（$((SECONDS - t0)) 秒）" "$out" \
              || echo "| $name | 失敗 | | | |" >> scores.md
          }
          Z="file://$PWD"
          run "辞書だけ" r2.json input.json --config_n_best 10
          run "xsmall・推論 5 回・文脈 20 字（今のアプリ）" r3.json input20.json --config_n_best 10 --zenz "$Z/xsmall.gguf" --config_zenzai_inference_limit 5
          run "small・推論 5 回・文脈 20 字" r4a.json input20.json --config_n_best 10 --zenz "$Z/small.gguf" --config_zenzai_inference_limit 5
          run "small・推論 10 回・文脈 40 字" r4b.json input.json --config_n_best 10 --zenz "$Z/small.gguf" --config_zenzai_inference_limit 10
          run "small・制限なし" r4.json input.json --config_n_best 10 --zenz "$Z/small.gguf"
          run "v3.1 small・推論 5 回・文脈 20 字" r5.json input20.json --config_n_best 10 --zenz "$Z/small31.gguf" --config_zenzai_inference_limit 5
          cat scores.md >> "$GITHUB_STEP_SUMMARY"
          cat scores.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            r*.json
            scores.md
