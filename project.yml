name: FlickKey
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
packages:
  Engine:
    path: Packages/Engine
settings:
  base:
    # 署名するときに自分のものへ変える（Apple Developer で登録した ID）
    BUNDLE_ID: com.example.flickkey
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    # Zenzai（llama.cpp）を使う変換エンジンは C++ 相互運用つきで作られるので、使う側も合わせる
    SWIFT_OBJC_INTEROP_MODE: objcxx
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FlickKey:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: フリックキー
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
    dependencies:
      - target: FlickKeyboard
      - package: Engine
  FlickKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      # Release「dictionary」から CI が取ってくる（.gitignore 済み）。アプリはここを読みに来る。
      - path: Resources/Dictionary
        type: folder
        buildPhase: resources
      - path: Resources/EmojiDictionary
        type: folder
        buildPhase: resources
      - path: Resources/zenz.gguf
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: フリックキー
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).keyboard
    dependencies:
      - package: Engine
  FlickKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FlickKey
      - package: Engine
  FlickKeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FlickKey
schemes:
  FlickKey:
    build:
      targets:
        FlickKey: all
    test:
      targets: [FlickKeyTests, FlickKeyUITests]
