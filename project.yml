name: FlickKey
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
packages:
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    exactVersion: 0.11.2
settings:
  base:
    # 署名するときに自分のものへ変える（Apple Developer で登録した ID）
    BUNDLE_ID: com.example.flickkey
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FlickKey:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: フリックキー
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
    dependencies:
      - target: FlickKeyboard
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModule
  FlickKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      # Release「dictionary」から CI が取ってくる（.gitignore 済み）。アプリはここを読みに来る。
      - path: Resources/Dictionary
        type: folder
        buildPhase: resources
      - path: Resources/EmojiDictionary
        type: folder
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: フリックキー
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).keyboard
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModule
  FlickKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FlickKey
  FlickKeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FlickKey
schemes:
  FlickKey:
    build:
      targets:
        FlickKey: all
    test:
      targets: [FlickKeyTests, FlickKeyUITests]
